[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
authors = ["David Ulrich <david@ulrichdev.com>"]
repository = ""
rust-version = "1.85"

# Shared dependency versions. Crates opt in via `dep.workspace = true`.
[workspace.dependencies]
crucible-term-core = { path = "crates/crucible-term-core" }

# The VT core (parser, grid, scrollback, reflow, damage). Exact pin: a 0.x crate whose public
# internals are not a stable API (plan 01 "Dependency posture"). No default features: no `pty`
# (corcovado/teletypewriter), no clipboard, renderer or windowing.
rio-vt = { version = "=0.5.29", default-features = false }

# Type-only dependencies of rio-vt's `Handler` trait, named by the ED 1 interception wrapper in
# `crucible-term-core`. Both are already in the lock through rio-vt, so no new lock entries.
rio-graphics = { version = "=0.5.29", default-features = false }
cursor-icon = { version = "1.1.0", default-features = false }

# The owned PTY: openpty, ioctls (TIOCSWINSZ, TIOCSCTTY), fd flags, process wait.
rustix = { version = "1", features = ["pty", "termios", "process", "fs", "stdio", "event"] }

# `close_range(2)` in the PTY child before exec (rustix has no wrapper). Already in the lock.
libc = "0.2"

# Font stack (plan 01 "Dependency posture"): fontconfig for discovery and fallback (system lib,
# linked through pkg-config), swash for shaping and rasterization including colour emoji.
swash = "0.2"
yeslogic-fontconfig-sys = "6.0.1"

# Wayland client, matching CDE's lock (sctk 0.20.0, wayland-client 0.31.14, wayland-protocols 0.32).
# calloop comes through sctk's re-export so the versions cannot drift apart.
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# The `crucible-window-identity-v1` client bindings (scanner macros). Already in the lock through
# wayland-client / wayland-protocols, so no new lock entries.
wayland-scanner = "0.31"
wayland-backend = "0.3"

# KDL config (matches CDE: kdl 6, default features).
kdl = "6"

# Lints are defined once here and inherited by every crate with `[lints] workspace = true`.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

# Release: whole-program LTO in one codegen unit (smaller text, measured in plan 02 WP-9).
# `panic = "abort"`: no crate uses `catch_unwind`, no thread is joined for its panic, and the
# only `Drop` (fontconfig `FcFini`) has no effect that outlives the process; PTY child reaping
# and SIGHUP are explicit (`App::close`), not drop-driven.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
